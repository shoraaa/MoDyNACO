# Reconstructed single-head static-prior retraining config for BPP-120.
problem: bpp
n_node: 120
k_sparse: 32
n_ants: 100
H: 5
mini_H: 5
epochs: 10
steps_per_epoch: 16
aco_iters_per_sample: 20
rho: 0.9
alpha: 1.0
beta: 1.0
lr: 0.0003
gamma: 1.0
min_gamma: 0.0
warmup: 0
train_anneal: false
static_prior: true
no_dynamic_feats: false
no_logit_net: false
grad_checkpointing: false
multi_head: false
device: cuda:0
seed: 1234
save_dir: checkpoints_extended/paperscale
save_interval: 1

# BPP-specific
capacity: 150.0

# Experiment metadata
experiment_name: bpp_n120_static_retrain20
description: "DeepACO-scale BPP-120 static-prior single-head retraining, 100 ants, 20 epochs x 32 steps"
author: "DyNACO Team"

# W&B
use_wandb: false
wandb_project: "dyanco"
wandb_entity: null
val_size: 8
