# MKP n50 MH PPO: init shared base from trained SH (mh1), FREEZE base, train only
# the 8 per-head adapters (alpha=8) so they specialize into diverse GOOD refinements
# on top of an SH-quality base. Addresses "every head weaker than SH" (base was undertrained).
problem: mkp
n_node: 50
k_sparse: 32
n_ants: 48
H: 5
mini_H: 10
epochs: 30
steps_per_epoch: 6
val_size: 8
rho: 0.5
alpha: 1.0
beta: 1.0
lr: 0.0002
warmup: 0
train_anneal: false
static_prior: false
no_dynamic_feats: false
no_logit_net: false
grad_checkpointing: false
multi_head: true
algo: ppo
ppo_epochs: 4
ppo_clip: 0.1
freeze_lora_base: true
init_mh_base_checkpoint: checkpoints_extended/ppo50_mkp_sh/mkp_n50_k32_ants48_H5_miniH10_rho0.5_lr5e-05_mh1_deep_lora_best.pt
device: cuda:0
seed: 1234
save_dir: checkpoints_extended/ppo50_mkp_frozen
save_interval: 10
use_wandb: false
experiment_name: mkp_n50_mh_ppo_frozen
num_heads: 8
head_zdim: 128
head_router: static
head_loss_mode: winner
head_decoder_type: deep_lora
lora_rank: 8
lora_alpha: 8.0
head_adapter_init: random
m: 5
