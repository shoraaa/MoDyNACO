# MKP n50 MH bake-off A: multi_decoder (independent decoder per head) + mean loss
problem: mkp
n_node: 50
k_sparse: 32
n_ants: 48
H: 5
mini_H: 5
epochs: 15
steps_per_epoch: 8
val_size: 8
rho: 0.9
alpha: 1.0
beta: 1.0
lr: 0.0003
warmup: 0
train_anneal: false
static_prior: false
no_dynamic_feats: false
no_logit_net: false
grad_checkpointing: false
multi_head: true
device: cuda:0
seed: 1234
save_dir: checkpoints_extended/bakeoff
save_interval: 1
use_wandb: false
experiment_name: mkp_n50_mh_md
num_heads: 8
head_zdim: 128
head_router: static
head_loss_mode: mean
head_decoder_type: multi_decoder
lora_rank: 8
head_adapter_init: random
m: 5
