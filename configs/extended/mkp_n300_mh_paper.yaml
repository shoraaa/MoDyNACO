# Reconstructed single-head dynamic retraining config for MKP-300.
problem: mkp
n_node: 300
k_sparse: 32
n_ants: 100
H: 5
mini_H: 5
epochs: 4
steps_per_epoch: 8
aco_iters_per_sample: 20
rho: 0.9
alpha: 1.0
beta: 1.0
lr: 0.0003
gamma: 1.0
min_gamma: 0.0
warmup: 0
train_anneal: false
static_prior: false
no_dynamic_feats: false
no_logit_net: false
grad_checkpointing: false
device: cuda:0
seed: 1234
save_dir: checkpoints_extended/paperscale
save_interval: 1

# MKP-specific
m: 5

# Experiment metadata
experiment_name: mkp_n300_mh_paper
description: "DeepACO-scale MKP-300 dynamic single-head retraining, 100 ants, 20 epochs x 32 steps"
author: "DyNACO Team"

# W&B
use_wandb: false
wandb_project: "dyanco"
wandb_entity: null
val_size: 4
multi_head: true
num_heads: 4
head_zdim: 128
head_router: learned
head_loss_mode: winner
head_decoder_type: deep_lora
lora_rank: 8
head_adapter_init: random
