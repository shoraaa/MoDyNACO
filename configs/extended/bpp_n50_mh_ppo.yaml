# BPP n50 MH via PPO (TSP n1000_deep_100.yaml regime, scaled to n50)
problem: bpp
n_node: 50
k_sparse: 32
n_ants: 64
H: 5
mini_H: 10
epochs: 25
steps_per_epoch: 6
val_size: 8
rho: 0.5
alpha: 1.0
beta: 1.0
lr: 0.00005
warmup: 0
train_anneal: false
static_prior: false
no_dynamic_feats: false
no_logit_net: false
grad_checkpointing: false
multi_head: true
algo: ppo
ppo_epochs: 4
ppo_clip: 0.1
device: cuda:0
seed: 1234
save_dir: checkpoints_extended/ppo50_bpp
save_interval: 5
use_wandb: false
experiment_name: bpp_n50_mh_ppo
num_heads: 8
head_zdim: 128
head_router: static
head_loss_mode: winner
head_decoder_type: deep_lora
lora_rank: 8
head_adapter_init: random
