# Ind-R ablation matched to configs/tsp/n1000_deep_100.yaml
problem: tsp
n_node: 1000
k_sparse: 32
n_ants: 100
H: 10
mini_H: 100
epochs: 20
steps_per_epoch: 32
ppo_epochs: 4
algo: ppo
alg: faco
rho: 0.5
lr: 0.000005
device: cuda:0
seed: 1234
min_new_edges: 12
edge_feature_set: compact3

val_dataset: data/TSP/data/validation_set/validation_TSP1000_n128.txt
test_dataset: data/TSP/data/test_set/STAR_TSP_lt1000.txt
val_size: 16
baseline: none

# Match the 8-head deep_lora method with 8 independently trained single-head policies.
members: 8
num_heads: 8
eval_method: model_anneal

# Optional matched multi-head evaluation if --multihead-checkpoint is provided.
head_decoder_type: deep_lora
lora_rank: 8
head_adapter_init: random

experiment_name: tsp_n1000_deep_100_ind_r
description: "Ind-8 independently trained single-head ablation matched to TSP n1000 deep_lora 100-ant budget"
author: "DyNACO Team"
