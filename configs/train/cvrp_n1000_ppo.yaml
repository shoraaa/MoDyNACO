# DyNACO Configuration: CVRP-1000 with PPO
problem: cvrp
n_node: 1000
k_sparse: 32
n_ants: 100
H: 10
mini_H: 100
epochs: 10
algo: ppo
rho: 0.5
lr: 0.000005
device: cuda:0
seed: 1234
grad_checkpointing: false
ablation_pheromone_features: false
ablation_incumbent_features: false
no_logit_net: false
no_dynamic_feats: false

# CVRP-specific
capacity: 150.0

# Experiment metadata
experiment_name: cvrp_n1000_ppo_v1
description: "CVRP-1K with PPO, standard dynamic features"
author: "DyNACO Team"

# W&B
use_wandb: true
wandb_project: "dyanco"
wandb_entity: null
