# DyNACO Configuration: TSP-1000, 3 edge features, routed multi-expert heads
problem: tsp
n_node: 1000
k_sparse: 32
algo: ppo
alg: faco

n_ants: 100
H: 10
mini_H: 100
epochs: 10
steps_per_epoch: 32
ppo_epochs: 4
ppo_clip: 0.1
ppo_lr: 5.0e-6
lr: null

rho: 0.5
min_new_edges: 12
alpha: 1.0
beta: 1.0
gamma: 1.0
min_gamma: 0.0
train_anneal: false
warmup: true
train_warmup: false
warmup_ratio: 0.5

# 3 edge-feature mode: dist_norm, log_tau_rel, is_in_incumbent
edge_feature_set: compact3
ablation_pheromone_features: false
ablation_incumbent_features: false
no_logit_net: false
no_dynamic_feats: false
grad_checkpointing: false

# Multi-expert head setup
multi_head: true
num_heads: 4
head_zdim: 16
head_training: polynet
head_gamma: 2.0
head_score_mode: mean
head_topq: 1
head_diversity_coef: 0.0
head_complement_coef: 0.0
head_deploy: ants
head_index: 0

# Adaptive ant routing
head_router: ema
head_router_alpha: 0.25
head_router_gamma: 1.0
head_router_min_frac: 0.05
head_router_score_mode: mean

val_dataset: data/TSP/data/test_set/STAR_TSP_lt1000.txt
val_size: 69
baseline: none
baseline_runs: 1
baseline_time_limit: 0.5

device: cuda:0
seed: 1234
no_wandb: true
save_dir: pretrained

# Experiment metadata
experiment_name: tsp_n1000_3f_multiexpert
description: "TSP-1K PPO with compact3 edge features, routed multi-expert heads, and separate decoders"
author: "DyNACO Team"
