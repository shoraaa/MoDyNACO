# DyNACO Configuration: CVRP-1000 with PPO
problem: cvrp
n_node: 1000
k_sparse: 32
n_ants: 32
H: 5
mini_H: 10
epochs: 50
algo: ppo
rho: 0.5
lr: 0.000005
device: cuda:0
seed: 1234
grad_checkpointing: false
ablation_pheromone_features: false
ablation_incumbent_features: false
no_logit_net: false
no_dynamic_feats: false
# edge_feature_set: compact3

val_dataset: data/CVRP/data/validation_set/validation_cvrp1000_n128_C250.txt
val_size: 128
baseline: none

# Experiment metadata
experiment_name: cvrp_n1000_3f
description: "Baseline CVRP-1K with PPO, 3 dynamic features"
author: "DyNACO Team"

# W&B
use_wandb: true
wandb_project: "dyanco"
wandb_entity: null
