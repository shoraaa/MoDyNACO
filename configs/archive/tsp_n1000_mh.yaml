# DyNACO Configuration: TSP-1000 with PPO
problem: tsp
n_node: 1000
k_sparse: 32
n_ants: 100
H: 10
mini_H: 100
epochs: 100
algo: ppo
rho: 0.5
lr: 0.000005
device: cuda:0
seed: 1234
grad_checkpointing: false
ablation_pheromone_features: false
ablation_incumbent_features: false
no_logit_net: false
no_dynamic_feats: false
edge_feature_set: compact3

# Experiment metadata
experiment_name: tsp_n1000_3f
description: "Baseline TSP-1K with PPO, 3 dynamic features"
author: "DyNACO Team"

# W&B
use_wandb: true
wandb_project: "dyanco"
wandb_entity: null

head_input_transform: d4
multi_head: true
num_heads: 4
head_zdim: 16
