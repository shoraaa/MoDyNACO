# DyNACO Configuration: TSP-1000 with PPO
problem: tsp
n_node: 1000
k_sparse: 32
n_ants: 32
H: 5
mini_H: 10
epochs: 10
algo: ppo
rho: 0.5
lr: 0.000005
device: cuda:0
seed: 1234
grad_checkpointing: false
ablation_pheromone_features: false
ablation_incumbent_features: false
no_logit_net: false
no_dynamic_feats: false
edge_feature_set: compact3

val_dataset: data/TSP/data/test_set/STAR_TSP_lt1000.txt
val_size: 69
baseline: none

# Experiment metadata
experiment_name: tsp_n1000_3f
description: "Baseline TSP-1K with PPO, 3 dynamic features"
author: "DyNACO Team"

# W&B
use_wandb: true
wandb_project: "dyanco"
wandb_entity: null
