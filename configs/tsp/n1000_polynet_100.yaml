# DyNACO Configuration: TSP-1000 with PPO and PolyNet decoder
problem: tsp
n_node: 1000
k_sparse: 32
n_ants: 100
H: 10
mini_H: 100
epochs: 30
algo: ppo
rho: 0.5
lr: 0.000005
device: cuda:0
seed: 1234
grad_checkpointing: false
min_new_edges: 12
ablation_pheromone_features: false
ablation_incumbent_features: false
no_logit_net: false
no_dynamic_feats: false
edge_feature_set: compact3

val_dataset: data/TSP/data/validation_set/validation_TSP1000_n128.txt
val_size: 16
baseline: none

multi_head: true
num_heads: 8
head_zdim: 128
head_router: static
head_decoder_type: polynet
poly_units: 64

# Experiment metadata
experiment_name: tsp_n1000_polynet_100
description: "TSP-1K PPO with PolyNet code-conditioned decoder, 3 dynamic features"
author: "DyNACO Team"

# W&B
use_wandb: true
wandb_project: "dyanco"
wandb_entity: null
