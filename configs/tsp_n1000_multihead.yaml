# DyNACO Configuration: TSP-1000 with PPO
problem: tsp
n_node: 1000
k_sparse: 32
n_ants: 100
H: 10
mini_H: 100
epochs: 10
algo: ppo
rho: 0.1
lr: 0.000005
device: cuda:0
seed: 1234
grad_checkpointing: false
ablation_pheromone_features: false
ablation_incumbent_features: false
no_logit_net: false
no_dynamic_feats: false
edge_feature_set: compact3

# Experiment metadata
experiment_name: tsp_n1000_ppo_v1
description: "Baseline TSP-1K with PPO, standard dynamic features"
author: "DyNACO Team"

# W&B
use_wandb: true
wandb_project: "dyanco"
wandb_entity: null

multi_head: true
num_heads: 4
head_zdim: 16
head_gamma: 1.0
head_score_mode: mean
head_topq: 1
head_diversity_coef: 0.01
head_deploy: ants
head_index: 0