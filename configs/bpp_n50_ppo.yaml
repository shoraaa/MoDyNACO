# DyNACO Configuration: Bin Packing Problem (BPP) with PPO
problem: bpp
n_node: 50
k_sparse: 32
n_ants: 20
H: 5
mini_H: 5
epochs: 10
algo: ppo
rho: 0.9
lr: 0.0003
