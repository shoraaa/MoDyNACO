# Default DyNACO training profile for STAR small TSP / TSPLIB-style transfer.
problem: tsp
n_node: 500
k_sparse: 32
n_ants: 100
H: 10
mini_H: 100
epochs: 10
steps_per_epoch: 32
algo: ppo
rho: 0.5
min_new_edges: 12
lr: 0.000005
device: cuda:0
seed: 1234
val_dataset: data/TSP/data/test_set/STAR_TSP_lt1000.txt
val_size: 69
baseline: none
no_wandb: true

experiment_name: tsp_star_lt1000_default
description: "Default training profile validated on STAR TSP instances with fewer than 1000 nodes."
